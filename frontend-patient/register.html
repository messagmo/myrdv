<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/style.css"><title>Inscription – MyRDV</title></head><body>
<div class="app">
<header class="header"><h1>Créer un compte</h1><p>Quelques informations suffisent</p><div class="chip"><img src="img/logo.png" alt="MyRDV"></div></header>
<form id="form" class="main" novalidate>
<div id="error" class="error" role="alert"></div>
<div class="field"><label for="prenom">Prénom</label><input class="input" id="prenom" autocomplete="given-name" required></div>
<div class="field"><label for="nom">Nom</label><input class="input" id="nom" autocomplete="family-name" required></div>
<div class="field"><label for="tel">Téléphone (pour les SMS)</label><input class="input" id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="6XX XX XX XX" required><div class="hint">Numéro camerounais à 9 chiffres, commençant par 6.</div></div>
<div class="field"><label for="email">Adresse e-mail (facultatif)</label><input class="input" id="email" type="email" autocomplete="email"></div>
<div class="field"><label for="pw">Mot de passe</label><input class="input" id="pw" type="password" autocomplete="new-password" required><div class="hint">8 caractères minimum.</div></div>
<div class="field"><label for="pw2">Confirmer le mot de passe</label><input class="input" id="pw2" type="password" autocomplete="new-password" required></div>
<p class="hint" style="margin:0">Un SMS vous sera envoyé quand l'hôpital aura confirmé un rendez-vous.</p>
<button class="btn" id="submit" type="submit">Créer mon compte</button>
<p class="center">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
</form></div>
<script src="js/ui.js"></script><script src="js/format.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/pages/register.js"></script></body></html>
