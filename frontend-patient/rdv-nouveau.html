<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/style.css"><title>Prendre rendez-vous – MyRDV</title></head><body>
<div class="app">
<header class="header"><a class="back" href="medecins.html">‹ Retour</a><h1>Prendre rendez-vous</h1><button class="link-btn" data-logout type="button">Se déconnecter</button><div class="chip"><img src="img/logo.png" alt="MyRDV"></div></header>
<form id="form" class="main" novalidate>
<div id="error" class="error" role="alert"></div>
<div class="field"><label for="service">Service</label><select class="input" id="service" required></select></div>
<div class="field"><label for="medecin">Médecin</label><select class="input" id="medecin" required></select></div>
<div class="field"><label id="days-label">Jour disponible</label><div class="pills" id="days" role="group" aria-labelledby="days-label"></div><p class="empty" id="days-msg">Choisissez un médecin.</p></div>
<fieldset class="slots" id="slots"><legend>Heure disponible</legend><span class="empty" id="slots-msg">Choisissez un jour.</span></fieldset>
<div class="field"><label for="motif">Motif (facultatif)</label><textarea class="input" id="motif" maxlength="200"></textarea><div class="hint">Ne saisissez aucune information médicale sensible.</div></div>
<p class="hint" style="margin:0">Vous recevrez un SMS dès que l'hôpital aura confirmé votre demande.</p>
<button class="btn" id="submit" type="submit">Envoyer la demande</button>
</form>
<nav class="tabs"><a href="services.html">Services</a><a href="medecins.html" >Médecins</a><a href="mes-rdv.html" >Mes RDV</a></nav>
</div><script src="js/format.js"></script><script src="js/auth.js"></script><script src="js/nav.js"></script><script src="js/api.js"></script><script src="js/pages/rdv-nouveau.js"></script></body></html>
